[project]
name = "axis-api"
version = "1.0.0"
description = "Multi-tenant REST API for stock and inventory management"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "alembic>=1.18.4",
    "argon2-cffi>=25.1.0",
    "Flask>=3.1.3",
    "flask-cors>=6.0.1",
    "Flask-JWT-Extended>=4.7.1",
    "Flask-Limiter>=3.8.0",
    "flask-talisman>=1.1.0",
    "limits[redis]>=5.8.0",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "spectree>=2.0.1",
    "SQLAlchemy>=2.0.37",
    "waitress>=3.0.2",
    "Werkzeug>=3.1.8",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.uv]
# The app is not a distributable package: the code runs from src/ as top-level
# modules, so uv installs the dependencies and nothing else.
package = false
